steps:
  # Step 1: Install dependencies
  - name: 'python:3.10'
    entrypoint: pip
    args: ['install', 'kfp', 'google-cloud-aiplatform', '--quiet']

  # Step 2: Compile pipeline
  - name: 'python:3.10'
    entrypoint: python
    args: ['projects/04-mlops-pipeline-inference-only/pipeline/pipeline.py']

  # Step 3: Copy compiled pipeline.yaml to GCS
  - name: 'gcr.io/cloud-builders/gsutil'
    args: [
      'cp',
      'projects/04-mlops-pipeline-inference-only/pipeline/pipeline.yaml',
      'gs://mlops-pipeline-inference-only-pipeline-root/compiled/pipeline.yaml'
    ]

  # Step 4: Submit pipeline run to Vertex AI
  - name: 'python:3.10'
    entrypoint: python
    args: ['projects/04-mlops-pipeline-inference-only/pipeline/run_pipeline.py']

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
